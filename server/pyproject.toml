[project]
name = "secondhand"
version = "0.1.0"
description = "Second Hand server: the agent behind the glasses (Meta Model API: Muse Spark, SAM 3.1, Muse Voice Transcribe)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "websockets>=13",
  "pydantic>=2.8",
  "fpdf2>=2.8.9",
]

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secondhand"]
